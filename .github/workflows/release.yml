name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: RePlayer-Windows-x64
          - os: windows-latest
            rid: win-arm64
            artifact_name: RePlayer-Windows-ARM64
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: RePlayer-Linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact_name: RePlayer-Linux-ARM64
          - os: macos-latest
            rid: osx-x64
            artifact_name: RePlayer-macOS-x64
          - os: macos-latest
            rid: osx-arm64
            artifact_name: RePlayer-macOS-ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RePlayerNative/RePlayer.csproj

      - name: Publish
        run: |
          dotnet publish RePlayerNative/RePlayer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: publish/${{ matrix.rid }}/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release archives
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            dirname=$(basename "$dir")
            cd "$dir"
            if [[ "$dirname" == *Windows* ]]; then
              zip -r "../../release/${dirname}.zip" .
            else
              tar -czf "../../release/${dirname}.tar.gz" .
            fi
            cd ../..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
