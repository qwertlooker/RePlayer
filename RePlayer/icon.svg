<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <circle r="140" fill="none" stroke="#00ccff" stroke-width="12" opacity="0.3"/>
    <circle r="140" fill="none" stroke="#00ccff" stroke-width="12" stroke-dasharray="220 660" stroke-dashoffset="-110" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </circle>
    <polygon points="-40,-60 -40,60 60,0" fill="#00ccff" transform="translate(10,0)"/>
    <text x="0" y="120" text-anchor="middle" fill="#d8e2f0" font-family="DM Sans,sans-serif" font-size="56" font-weight="600">Re</text>
  </g>
